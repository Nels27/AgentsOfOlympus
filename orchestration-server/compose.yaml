name: agents-of-olympus

networks:
  olympus:
    name: olympus
  delphi:
    name: delphi
    internal: true
  argus_net:
    name: argus_net
  cerberus_net:
    name: cerberus_net
    internal: true
  styx_net:
    name: styx_net
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  hermes:
    image: nousresearch/hermes-agent@sha256:b29520aa3244ab4f65cb9d66ba86db5e59d2f581c3b7401cd642e4325ca4883d
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    depends_on:
      - signal-cli
      - cerberus
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${API_SERVER_KEY}
      SIGNAL_HTTP_URL: http://signal-cli:8080
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT}
      DOCKER_HOST: tcp://cerberus:2375
    volumes:
      - ${HOME}/.hermes:/opt/data
    networks:
      - olympus
      - cerberus_net
    ports:
      - "127.0.0.1:8642:8642"

  signal-cli:
    image: registry.gitlab.com/packaging/signal-cli/signal-cli-jre@sha256:87ee76a3d4204a0d271ce2789b8d8b3ac5e715a06fe9ac80d4369c5fe982c078
    container_name: signal-cli
    user: "${UID}:${GID}"
    command: ["-a", "${SIGNAL_ACCOUNT}", "-d", "/data", "daemon", "--http", "0.0.0.0:8080"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.signal-cli:/data
    networks:
      - olympus

  cerberus:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: cerberus
    environment:
      CONTAINERS: "1"
      POST: "1"
      EXEC: "1"
      INFO: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cerberus_net

  sniproxy:
    image: ghcr.io/mosajjal/sniproxy@sha256:e9f872e4b7cd5f9c9439a0d3fd441722a4e9b36f3e2fe4232409aae36d4a9617
    container_name: sniproxy
    command: ["--config", "/tmp/config.yaml"]
    restart: unless-stopped
    volumes:
      - ../services/worker-image/sniproxy/config.yaml:/tmp/config.yaml:ro
      - ../services/worker-image/sniproxy/domainlist.csv:/tmp/domainlist.csv:ro
    networks:
      styx_net:
        ipv4_address: 172.31.0.10